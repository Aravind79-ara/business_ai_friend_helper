[project]
name = "ai-tech-consultant-capstone"
version = "0.1.0"
description = "AI Tech Consultant with Knowledge Brain, Inbox Agent, and Meeting-to-Scope workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.31",
  "pydantic>=2.7.4",
  "python-dotenv>=1.0.1",
  "openai>=3.35.1",
  "streamlit>=1.36.0",
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
